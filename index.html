<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>個人作品集入口 | Portfolio</title>
    <style>
        /* 基礎全域設定 */
        :root {
            --bg-color: #D12929;
            --card-bg: #F5C9C0;
            --text-main: #22336E;
            --text-sub: #6C769F;
            --teal-accent: #0024B1;       /* 湖水藍 主色 */
            --teal-hover: #862C48;        /* 湖水藍 深色 Hover */
            --teal-light: #F7EBDD;        /* 湖水藍 淡色背景 */
            --locked-bg: #edf2f7;
            --locked-text: #a0aec0;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.08);
            --radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        /* 主容器 */
        .container {
            width: 100%;
            max-width: 880px;
            background: var(--card-bg);
            border-radius: 20px;
            padding: 40px 30px;
            box-shadow: var(--shadow-md);
            text-align: center;
        }

        /* 個人簡介區塊 */
        .profile-section {
            margin-bottom: 36px;
        }

        .avatar {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid var(--card-bg);
            box-shadow: 0 4px 14px rgba(56, 178, 172, 0.25);
            margin-bottom: 16px;
            transition: transform 0.3s ease;
        }

        .avatar:hover {
            transform: scale(1.05);
        }

        .profile-name {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: 1px;
            margin-bottom: 6px;
        }

        .profile-subtitle {
            font-size: 0.95rem;
            color: var(--text-sub);
        }

        /* 按鈕網格（預設 4 欄） */
        .grid-menu {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
        }

        /* 按鈕基礎樣式 */
        .menu-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px 12px;
            border-radius: var(--radius);
            font-size: 0.9rem;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            min-height: 60px;
            line-height: 1.3;
        }

        /* 已解鎖按鈕（樣式） */
        .menu-btn.unlocked {
            background-color: var(--card-bg);
            color: var(--text-main);
            border: 1.5px solid var(--teal-accent);
            box-shadow: var(--shadow-sm);
        }

        /* 滑鼠懸停動畫效果（湖水藍） */
        .menu-btn.unlocked:hover {
            background-color: var(--teal-accent);
            color: #ffffff;
            transform: translateY(-3px);
            box-shadow: 0 6px 16px rgba(56, 178, 172, 0.35);
        }

        .menu-btn.unlocked:active {
            transform: translateY(-1px);
        }

        /* 未解鎖按鈕 (灰色鎖定狀態) */
        .menu-btn.locked {
            background-color: var(--locked-bg);
            color: var(--locked-text);
            border: 1.5px solid transparent;
            cursor: not-allowed;
            pointer-events: none; /* 防止點擊 */
        }

        /* 手機與平板響應式調整 */
        @media (max-width: 768px) {
            .grid-menu {
                grid-template-columns: repeat(2, 1fr); /* 平板/大螢幕手機變 2 欄 */
                gap: 12px;
            }
            .container {
                padding: 30px 20px;
            }
        }

        @media (max-width: 420px) {
            .grid-menu {
                grid-template-columns: 1fr; /* 小螢幕手機單欄排列 */
            }
        }
    </style>
</head>
<body>
